# Shared, machine-independent build config for every workspace member.
#
# Toolchain paths (linker, linker script, LLVM bin) are NOT hardcoded here —
# the `../klauss-build` driver discovers them relative to the repo and injects
# the linker flags via RUSTFLAGS. Build through that driver:
#   ../klauss-build elf blinky      ../klauss-build llext ext-hello
# A plain `cargo build -p <pkg>` still type-checks and (for llext staticlibs)
# links, but bare-metal binaries need the driver for the link step.

[build]
target = "../klausscpu-unknown-none-elf.json"

[unstable]
build-std = ["core", "alloc"]
# Bare-metal default keeps compiler-builtins-mem (binaries link standalone).
# The llext flavor overrides this (-Z build-std-features=optimize_for_size,
# done by the driver) so mem* resolve against the kernel exports.
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true

[target.klausscpu-unknown-none-elf]
# JSON target spec needs this; the driver re-sets it (plus -Clinker) via
# RUSTFLAGS, which takes precedence when building through klauss-build.
rustflags = ["-Zunstable-options"]
