# ── Core ──────────────────────────────────────────────────────────────────
CONFIG_BOARD_NEXYS_A7=y
CONFIG_XIP=n
CONFIG_DEBUG_INFO=n
CONFIG_SOC_KLAUSSCPU_NEXYS_A7=y
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_CBPRINTF_FP_A_SUPPORT=n

# ── UART ──────────────────────────────────────────────────────────────────
CONFIG_UART_KLAUSSCPU=y
CONFIG_UART_CONSOLE=y

# ── Timer ─────────────────────────────────────────────────────────────────
CONFIG_KLAUSSCPU_TIMER=y
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=100000000

# ── Networking ────────────────────────────────────────────────────────────
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_KLAUSSCPU=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y

# Network buffers
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_BUF_DATA_SIZE=256

# Log network events
CONFIG_NET_LOG=y
CONFIG_NET_DHCPV4_LOG_LEVEL_INF=y

# ── SD card + filesystem ─────────────────────────────────────────────────
CONFIG_DISK_ACCESS=y
CONFIG_DISK_KLAUSSCPU_SD=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FS_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_HEAP=y

# ── Shell (UART console) ─────────────────────────────────────────────────
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KLAUSSCPU_SHELL_CMDS=y

# ── SSH server (requires wolfSSL + wolfSSH libraries) ────────────────────
# Uncomment the line below once wolfSSL/wolfSSH are integrated:
# CONFIG_KLAUSSCPU_SSH_SERVER=y

# ── Memory ────────────────────────────────────────────────────────────────
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
