# picolibc-cross.ini — meson cross-compilation config for KlaussCPU.

[binaries]
c       = 'clang'
ar      = 'llvm-ar'
strip   = 'llvm-strip'
nm      = 'llvm-nm'
objcopy = 'llvm-objcopy'

[built-in options]
c_args      = ['-target', 'klausscpu-unknown-elf', '-O2', '-ffreestanding', '-fno-common', '-ffunction-sections', '-fdata-sections']
c_link_args = ['-target', 'klausscpu-unknown-elf', '-nostdlib']

[host_machine]
system     = 'none'
cpu_family = 'none'
cpu        = 'klausscpu'
endian     = 'little'
